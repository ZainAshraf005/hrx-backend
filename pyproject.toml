[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# FastAPI evaluates dependency declarations at import time by design.
# Treating Depends(...) and File(...) defaults as mutable/default-call bugs
# produces false positives throughout the API layer.

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
"app/dependencies/*.py" = ["B008"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "basic"
